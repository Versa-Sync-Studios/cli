name: Codex Windows Credential PR Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-credential:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack pnpm install

      - name: Test Go credential read from legacy TS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          $profile = "supabase-staging"
          $token = "sbp_" + ("a" * 40)
          $keyringPath = Join-Path (Get-Location) "apps\cli\node_modules\@napi-rs\keyring"
          $keyringRequire = $keyringPath -replace "\\", "/"
          $cleanup = "const {Entry}=require('$keyringRequire'); const service='Supabase CLI'; const account='$profile'; for (const e of [new Entry(service, account), Entry.withTarget(service+':'+account, service, account)]) { try { e.deleteCredential(); } catch {} }"

          node -e $cleanup | Out-Null
          Remove-Item Env:SUPABASE_ACCESS_TOKEN -ErrorAction SilentlyContinue

          $controlOutput = & npx bun apps/cli/src/legacy/main.ts --profile $profile projects list 2>&1 | Out-String
          $controlHasMissingToken = $controlOutput.Contains("Access token not provided")

          npx supabase@2.102.0 --profile $profile login --token $token
          if ($LASTEXITCODE -ne 0) {
            node -e $cleanup | Out-Null
            throw "Known-good Go login failed."
          }

          $inspect = "const {findCredentials}=require('$keyringRequire'); const service='Supabase CLI'; const account='$profile'; const rows=findCredentials(service, service+':'+account); console.log(JSON.stringify(rows.map(r=>({account:r.account,len:(r.password||'').length,prefix:(r.password||'').slice(0,4)}))));"
          $written = node -e $inspect
          Write-Host "Written credential: $written"

          $testOutput = & npx bun apps/cli/src/legacy/main.ts --profile $profile projects list 2>&1 | Out-String
          $testHasMissingToken = $testOutput.Contains("Access token not provided")
          $testHasInvalidFormat = $testOutput.Contains("Invalid access token format")
          $testHasUnauthorized = $testOutput.Contains("Unauthorized")

          node -e $cleanup | Out-Null

          Write-Host "controlHasMissingToken=$controlHasMissingToken"
          Write-Host "testHasMissingToken=$testHasMissingToken"
          Write-Host "testHasInvalidFormat=$testHasInvalidFormat"
          Write-Host "testHasUnauthorized=$testHasUnauthorized"

          if (-not $controlHasMissingToken) {
            throw "Control run did not prove the missing-token baseline."
          }

          if ($testHasMissingToken) {
            throw "PR branch still cannot read the persisted credential."
          }

          if ($testHasInvalidFormat) {
            throw "PR branch read the credential but decoded it incorrectly."
          }

          if (-not $testHasUnauthorized) {
            throw "Expected Unauthorized after reading the fake token."
          }
